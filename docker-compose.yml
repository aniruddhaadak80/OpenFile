# OpenFile with Docker Compose:  docker compose up -d   then open http://localhost:8080
services:
  openfile:
    image: ghcr.io/aniruddhaadak80/openfile:latest
    container_name: openfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # set to "true" for cross-origin isolation (faster multi-threaded on-device AI)
      OPENFILE_CROSS_ORIGIN_ISOLATION: "false"
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # to build from source instead of pulling, replace "image" with:
    # build: .
