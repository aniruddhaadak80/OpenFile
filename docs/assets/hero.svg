<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="OpenFile: every file tool, one private browser tab">
  <title>OpenFile</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset=".55" stop-color="#0B0D10"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A524"><animate attributeName="stop-color" values="#F5A524;#FFB224;#14B8A6;#F5A524" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset=".5" stop-color="#FFE3A3"/>
      <stop offset="1" stop-color="#FFB224"><animate attributeName="stop-color" values="#FFB224;#14B8A6;#F5A524;#FFB224" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#FFB224" stop-opacity=".42"/><stop offset=".55" stop-color="#F5A524" stop-opacity=".12"/><stop offset="1" stop-color="#F5A524" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#14B8A6" stop-opacity=".30"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC"><stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F5A524" stroke-opacity=".05"/></pattern>
    <clipPath id="clip"><rect width="1200" height="440" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#grid)"/>
  <circle cx="600" cy="220" r="260" fill="url(#glowA)"><animate attributeName="r" values="230;290;230" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="190" cy="80" r="220" fill="url(#glowB)"><animate attributeName="opacity" values=".6;1;.6" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="380" r="240" fill="url(#glowC)"><animate attributeName="opacity" values="1;.5;1" dur="7s" repeatCount="indefinite"/></circle>
  
  <g transform="translate(600 228) scale(1 0.400)">
    <circle r="300" fill="none" stroke="#F5A524" stroke-opacity=".22" stroke-width="3.50" stroke-dasharray="4 10"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <circle cx="300" cy="0" r="7" fill="#F5A524"><animate attributeName="opacity" values="1;.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="-300" cy="0" r="4" fill="#F5A524" opacity=".7"/>
    </g>
  </g>
  <g transform="translate(600 228) scale(1 0.395)">
    <circle r="380" fill="none" stroke="#14B8A6" stroke-opacity=".22" stroke-width="3.55" stroke-dasharray="4 10"/>
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
      <circle cx="380" cy="0" r="7" fill="#14B8A6"><animate attributeName="opacity" values="1;.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="-380" cy="0" r="4" fill="#14B8A6" opacity=".7"/>
    </g>
  </g>
  <g transform="translate(600 228) scale(1 0.391)">
    <circle r="460" fill="none" stroke="#22D3EE" stroke-opacity=".22" stroke-width="3.58" stroke-dasharray="4 10"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
      <circle cx="460" cy="0" r="7" fill="#22D3EE"><animate attributeName="opacity" values="1;.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="-460" cy="0" r="4" fill="#22D3EE" opacity=".7"/>
    </g>
  </g>
  
  <g transform="translate(150 110)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.5s" begin="-0s" repeatCount="indefinite"/>
    <rect x="-29.5" y="-16" width="59" height="32" rx="9" fill="#111418" stroke="#F5A524" stroke-width="1.5"/>
    <circle cx="-17.5" cy="0" r="4" fill="#F5A524"/>
    <text x="6" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F3EE">PDF</text>
  </g></g>
  <g transform="translate(1010 96)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.5s" begin="-1.2s" repeatCount="indefinite"/>
    <rect x="-29.5" y="-16" width="59" height="32" rx="9" fill="#111418" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="-17.5" cy="0" r="4" fill="#10B981"/>
    <text x="6" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F3EE">PNG</text>
  </g></g>
  <g transform="translate(1060 318)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.5s" begin="-0.6s" repeatCount="indefinite"/>
    <rect x="-29.5" y="-16" width="59" height="32" rx="9" fill="#111418" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="-17.5" cy="0" r="4" fill="#22D3EE"/>
    <text x="6" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F3EE">MP4</text>
  </g></g>
  <g transform="translate(118 318)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.5s" begin="-1.8s" repeatCount="indefinite"/>
    <rect x="-29.5" y="-16" width="59" height="32" rx="9" fill="#111418" stroke="#14B8A6" stroke-width="1.5"/>
    <circle cx="-17.5" cy="0" r="4" fill="#14B8A6"/>
    <text x="6" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F3EE">MP3</text>
  </g></g>
  <g transform="translate(240 214)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.5s" begin="-2.4s" repeatCount="indefinite"/>
    <rect x="-35.0" y="-16" width="70" height="32" rx="9" fill="#111418" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="-23.0" cy="0" r="4" fill="#38BDF8"/>
    <text x="6" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F3EE">JSON</text>
  </g></g>
  <g transform="translate(945 212)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.5s" begin="-0.9s" repeatCount="indefinite"/>
    <rect x="-29.5" y="-16" width="59" height="32" rx="9" fill="#111418" stroke="#FFB224" stroke-width="1.5"/>
    <circle cx="-17.5" cy="0" r="4" fill="#FFB224"/>
    <text x="6" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F3EE">SVG</text>
  </g></g>
  <g text-anchor="middle">
    <text x="600" y="92" font-size="15" font-weight="600" letter-spacing="4" fill="#F5A524">FREE · OPEN SOURCE · IN-BROWSER</text>
    <text x="600" y="232" font-size="118" font-weight="800" letter-spacing="-3" fill="url(#title)">OpenFile</text>
    <text x="600" y="286" font-size="30" font-weight="600" fill="#F5F3EE">Every file tool. One private browser tab.</text>
    <text x="600" y="326" font-size="18" fill="#A8A29E">427 tools for PDF, images, video, audio, data and code, zero uploads</text>
  </g>
  <g transform="translate(600 372)">
    <rect x="-128" y="-17" width="256" height="34" rx="17" fill="#111418" stroke="#10B981" stroke-opacity=".6"/>
    <circle cx="-104" cy="0" r="5" fill="#10B981"><animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="10" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F3EE">Runs 100% on your device</text>
  </g>
  <rect x="0" y="436" width="1200" height="4" fill="url(#title)"/>
  </g>
</svg>