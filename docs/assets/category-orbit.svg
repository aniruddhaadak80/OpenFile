      <circle r="58" fill="#22D3EE" opacity=".12"><animate attributeName="r" values="52;62;52" dur="3s" begin="-1.2s" repeatCount="indefinite"/></circle>
      <rect x="-59.0" y="-34" width="118.0" height="68" rx="18" fill="#111418" stroke="#22D3EE" stroke-width="2"/>
