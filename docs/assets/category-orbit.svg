  <circle cx="500" cy="310" r="120" fill="url(#halo)"><animate attributeName="r" values="100;135;100" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="310" r="74" fill="#0B0D10" stroke="url(#core)" stroke-width="6"/>
  <circle cx="500" cy="310" r="82" fill="none" stroke="#FFB224" stroke-opacity=".35" stroke-width="2"><animate attributeName="stroke-opacity" values=".15;.6;.15" dur="3s" repeatCount="indefinite"/></circle>
