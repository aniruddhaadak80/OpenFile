<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Eight tool categories orbiting the OpenFile core">
  <title>OpenFile categories</title>
  <defs>
    <radialGradient id="core"><stop offset="0" stop-color="#FFB224"/><stop offset=".7" stop-color="#F5A524"/><stop offset="1" stop-color="#9A5B05"/></radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#FFB224" stop-opacity=".5"/><stop offset="1" stop-color="#FFB224" stop-opacity="0"/></radialGradient>
  </defs>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="1000" height="620" rx="28" fill="#050505"/>
  <circle cx="500" cy="310" r="225" fill="none" stroke="#F5A524" stroke-opacity=".28" stroke-width="2"/>
  <circle cx="500" cy="310" r="155" fill="none" stroke="#14B8A6" stroke-opacity=".3" stroke-dasharray="2 9" stroke-width="2">
