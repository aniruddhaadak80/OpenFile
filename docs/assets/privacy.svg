<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Privacy: files never leave your device">
  <title>Files never leave your device</title>
  <defs>
    <linearGradient id="dev" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111418"/><stop offset="1" stop-color="#0B0D10"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#F5A524"/><stop offset="1" stop-color="#14B8A6"/></linearGradient>
    <radialGradient id="eglow"><stop offset="0" stop-color="#FFB224" stop-opacity=".35"/><stop offset="1" stop-color="#FFB224" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .spin{transform-origin:450px 205px;animation:spin 6s linear infinite}
    .shield{transform-origin:1010px 190px;animation:pulse 2.4s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  </style>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="400" rx="28" fill="#050505"/>
  <rect x="40" y="56" width="760" height="300" rx="24" fill="url(#dev)" stroke="#10B981" stroke-width="2" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.5s" repeatCount="indefinite"/></rect>
  <rect x="64" y="40" width="190" height="32" rx="16" fill="#050505" stroke="#10B981"/>
  <text x="159" y="61" text-anchor="middle" font-size="14" font-weight="700" fill="#10B981">YOUR DEVICE</text>
  <circle cx="84" cy="100" r="6" fill="#F5A524"/><circle cx="104" cy="100" r="6" fill="#14B8A6"/><circle cx="124" cy="100" r="6" fill="#10B981"/>
  <rect x="150" y="88" width="300" height="24" rx="12" fill="#050505"/>
  <text x="166" y="105" font-size="13" fill="#A8A29E">openfile-studio.vercel.app</text>
  <g transform="translate(150 205)">
    <path d="M-34 -44h46l22 22v66h-68z" fill="#3A2A0A" stroke="#F5A524" stroke-width="2"/>
    <path d="M12 -44v22h22" fill="none" stroke="#F5A524" stroke-width="2"/>
    <text y="10" text-anchor="middle" font-size="16" font-weight="800" fill="#FFE3A3">PDF</text>
    <text y="74" text-anchor="middle" font-size="14" fill="#A8A29E">your file</text>
  </g>
  <path d="M200 205H390M510 205H690" stroke="url(#beam)" stroke-width="3" stroke-dasharray="8 8" fill="none">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1s" repeatCount="indefinite"/></path>
  <circle r="7" fill="#FFB224" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion path="M200 205H390" dur="2s" repeatCount="indefinite"/></circle>
  <circle r="7" fill="#22D3EE" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion path="M510 205H690" dur="2s" begin="-1s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="205" r="90" fill="url(#eglow)"/>
  <g class="spin">
    <circle cx="450" cy="205" r="52" fill="none" stroke="#F5A524" stroke-width="10" stroke-dasharray="14 10"/>
  </g>
  <circle cx="450" cy="205" r="38" fill="#0B0D10" stroke="#FFB224" stroke-width="2"/>
  <text x="450" y="201" text-anchor="middle" font-size="13" font-weight="800" fill="#F5A524">WASM</text>
  <text x="450" y="219" text-anchor="middle" font-size="11" fill="#F5F3EE">in your tab</text>
  <text x="450" y="290" text-anchor="middle" font-size="14" fill="#A8A29E">pdf-lib · ffmpeg · AI</text>
  <g transform="translate(730 205)">
    <rect x="-34" y="-40" width="68" height="80" rx="12" fill="#06261C" stroke="#10B981" stroke-width="2"/>
    <path d="M0 -20v28M-12 -2l12 12 12-12M-16 20h32" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="74" text-anchor="middle" font-size="14" fill="#A8A29E">download</text>
  </g>
  <path d="M800 205H940" stroke="#EF4444" stroke-opacity=".55" stroke-width="3" stroke-dasharray="4 8"/>
  <g transform="translate(870 205)"><circle r="16" fill="#2A0C0C" stroke="#EF4444" stroke-width="2"/><path d="M-6 -6l12 12M6 -6l-12 12" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/></g>
  <g opacity=".55">
    <path d="M985 250h80a30 30 0 0 0 0-60a44 44 0 0 0-84-10a34 34 0 0 0 4 70z" fill="#111418" stroke="#4B5058" stroke-width="2"/>
    <text x="1030" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#A8A29E">SERVERS</text>
  </g>
  <g class="shield">
    <path d="M1010 112l38 14v28c0 26-16 44-38 54c-22-10-38-28-38-54v-28z" fill="#3A2A0A" stroke="#F5A524" stroke-width="2.5"/>
    <path d="M995 158l11 11 20-22" fill="none" stroke="#FFB224" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1010" y="300" text-anchor="middle" font-size="30" font-weight="800" fill="#F5A524">0 bytes</text>
  <text x="1010" y="326" text-anchor="middle" font-size="15" fill="#A8A29E">uploaded. Ever.</text>
  <text x="420" y="388" text-anchor="middle" font-size="17" font-weight="700" fill="#F5F3EE">Files never leave your device, processing happens inside the browser tab.</text>
  </g>
</svg>