<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Built by Aniruddha Adak, open-source developer">
  <title>Built by Aniruddha Adak</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0D10"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#FFB224" stop-opacity=".55"/><stop offset=".45" stop-color="#F5A524" stop-opacity=".18"/><stop offset="1" stop-color="#F5A524" stop-opacity="0"/></radialGradient>
    <radialGradient id="ringglow"><stop offset=".78" stop-color="#FFB224" stop-opacity="0"/><stop offset=".9" stop-color="#FFB224" stop-opacity=".5"/><stop offset="1" stop-color="#FFB224" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE3A3"/><stop offset=".5" stop-color="#FFB224"/><stop offset="1" stop-color="#F5A524"/></linearGradient>
    <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#FFE3A3"/><stop offset=".5" stop-color="#FFB224"/><stop offset="1" stop-color="#F5A524"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#F5A524" stop-opacity="0"/><stop offset=".5" stop-color="#FFB224"/><stop offset="1" stop-color="#F5A524" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="1000" height="300" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="998.5" height="298.5" rx="25.5" fill="none" stroke="#F5A524" stroke-opacity=".28" stroke-width="1.5"/>
  <circle cx="160" cy="150" r="150" fill="url(#halo)"><animate attributeName="opacity" values=".7;1;.7" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="150" r="106" fill="url(#ringglow)"><animate attributeName="r" values="102;112;102" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="150" r="92" fill="#050505" stroke="url(#ring)" stroke-width="4"/>
  <g><animateTransform attributeName="transform" type="rotate" from="0 160 150" to="360 160 150" dur="9s" repeatCount="indefinite"/>
    <circle cx="160" cy="150" r="92" fill="none" stroke="#FFE3A3" stroke-width="5" stroke-linecap="round" stroke-dasharray="60 518.1"/>
    <circle cx="252" cy="150" r="5" fill="#FFF7E0"/>
  </g>
  <circle cx="160" cy="150" r="76" fill="none" stroke="#14B8A6" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="2 8">
    <animateTransform attributeName="transform" type="rotate" from="360 160 150" to="0 160 150" dur="30s" repeatCount="indefinite"/></circle>
  <text x="160" y="166" text-anchor="middle" font-size="48" font-weight="800" letter-spacing="2" fill="url(#name)">AA</text>
  <circle cx="100" cy="80" r="2" fill="#FFB224"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="-0s" repeatCount="indefinite"/></circle><circle cx="230" cy="110" r="2" fill="#FFB224"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="-0.8s" repeatCount="indefinite"/></circle><circle cx="200" cy="225" r="2" fill="#FFB224"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/></circle><circle cx="85" cy="190" r="2" fill="#FFB224"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="-2.4s" repeatCount="indefinite"/></circle><circle cx="170" cy="55" r="2" fill="#FFB224"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="-3.1s" repeatCount="indefinite"/></circle>
  <text x="300" y="86" font-size="14" font-weight="700" letter-spacing="4" fill="#F5A524">BUILT BY</text>
  <text x="300" y="138" font-size="46" font-weight="800" letter-spacing="-1" fill="url(#name)">Aniruddha Adak</text>
  <text x="300" y="174" font-size="20" font-weight="600" fill="#F5F3EE">Open-source developer · Agentic harnesses &amp; agent skills</text>
  <text x="300" y="204" font-size="16" fill="#A8A29E">West Bengal, India · B.Tech CSE (2026) · Hackathon builder · Daily AI news on DEV</text>
  <g transform="translate(300 232)" font-size="13" font-weight="700">
    <rect width="132" height="28" rx="14" fill="#3A2A0A" stroke="#F5A524" stroke-opacity=".7"/><text x="66" y="19" text-anchor="middle" fill="#FFE3A3">Open source</text>
    <rect x="144" width="150" height="28" rx="14" fill="#062421" stroke="#14B8A6" stroke-opacity=".7"/><text x="219" y="19" text-anchor="middle" fill="#99F6E4">Agentic systems</text>
    <rect x="306" width="140" height="28" rx="14" fill="#06212B" stroke="#22D3EE" stroke-opacity=".7"/><text x="376" y="19" text-anchor="middle" fill="#A5F3FC">Hackathons</text>
    <rect x="458" width="120" height="28" rx="14" fill="#06261C" stroke="#10B981" stroke-opacity=".7"/><text x="518" y="19" text-anchor="middle" fill="#A7F3D0">AI writing</text>
  </g>
  <rect x="0" y="297" width="1000" height="3" fill="url(#edge)"><animate attributeName="x" values="-1000;1000" dur="6s" repeatCount="indefinite"/></rect>
  </g>
</svg>