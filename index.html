    <style id="of-critical">
      /* critical boot CSS: paints the theme background and the splash before any bundle loads */
      html{background:#0B0D10}html[data-theme=black]{background:#000}html[data-theme=light]{background:#FAFAF7}
      body{margin:0}
      /* the pre-rendered SEO copy stays in the DOM for crawlers but is never painted for people */
      #prerender{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;opacity:0;pointer-events:none}
      #of-splash{display:none}
      .of-boot #root{opacity:0}
      .of-ready #root{opacity:1;transition:opacity .45s ease}
      .of-boot #of-splash,.of-ready #of-splash{display:grid;position:fixed;inset:0;z-index:2147483000;place-items:center;background:#000}
      html[data-theme=dark] #of-splash{background:#0B0D10}html[data-theme=light] #of-splash{background:#FAFAF7}
      .of-ready #of-splash{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s ease,visibility 0s linear .45s}
      .of-mark{position:relative;width:84px;height:84px;display:grid;place-items:center}
      .of-mark svg{width:56px;height:56px;animation:of-breathe 1.8s ease-in-out infinite}
      .of-mark::before,.of-mark::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(245,165,36,.55);animation:of-pulse 1.8s cubic-bezier(.2,.6,.3,1) infinite}
      .of-mark::after{inset:-2px;border:2px solid transparent;border-top-color:#FFD27A;border-right-color:rgba(20,184,166,.6);animation:of-spin 1.1s linear infinite}
      @keyframes of-pulse{0%{transform:scale(.82);opacity:.9}100%{transform:scale(1.35);opacity:0}}
      @keyframes of-spin{to{transform:rotate(360deg)}}
      @keyframes of-breathe{0%,100%{opacity:.85;transform:scale(.97)}50%{opacity:1;transform:scale(1)}}
      @media (prefers-reduced-motion:reduce){html:not(.motion-full) .of-mark svg,html:not(.motion-full) .of-mark::before,html:not(.motion-full) .of-mark::after{animation:none}html:not(.motion-full) .of-ready #root,html:not(.motion-full) .of-ready #of-splash{transition:none}}
      html.reduce-motion .of-mark svg,html.reduce-motion .of-mark::before,html.reduce-motion .of-mark::after{animation:none}
    </style>
    <noscript><style>.of-boot #root{opacity:1}#of-splash{display:none!important}#prerender{position:static!important;width:auto;height:auto;margin:0 auto;overflow:visible;clip:auto;clip-path:none;white-space:normal;opacity:1;pointer-events:auto}</style></noscript>
    <script>
      // before first paint: apply the saved theme and motion preference (full logic lives in src/lib/prefs.ts) and turn on the boot splash
      (function () { var r = document.documentElement; r.classList.add('of-boot');
        try { var p = JSON.parse(localStorage.getItem('of:prefs') || '{}'), t = p.theme || 'system';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          r.dataset.theme = t; r.classList.toggle('dark', t !== 'light');
          if (p.reducedMotion === 'reduce') r.classList.add('reduce-motion'); if (p.reducedMotion === 'full') r.classList.add('motion-full');
          var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'light' ? '#FAFAF7' : t === 'black' ? '#000000' : '#0B0D10');
        } catch (e) {}
        // failsafe: if the app bundle cannot load, drop the splash and show the plain guide instead of a blank page
        var fail = function () { if (!r.classList.contains('of-boot')) return; r.classList.remove('of-boot'); r.classList.add('of-fail') };
        addEventListener('error', function (e) { var t = e.target; if (t && t.tagName === 'SCRIPT' && /\/assets\//.test(t.src || '')) fail() }, true);
        setTimeout(fail, 30000);
        // keep the install prompt event even if it fires before the app bundle is ready (src/lib/ux.ts reads it)
        addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__ofBIP = e; dispatchEvent(new Event('of:bip')) });
        addEventListener('appinstalled', function () { window.__ofBIP = undefined });
      })();
    </script>
    <style>.of-fail #prerender{position:static!important;width:auto;height:auto;margin:0 auto;overflow:visible;clip:auto;clip-path:none;white-space:normal;opacity:1;pointer-events:auto}</style>
