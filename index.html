    <script>
      // apply the saved theme before first paint (full logic lives in src/lib/prefs.ts)
      try { var p = JSON.parse(localStorage.getItem('of:prefs') || '{}'), t = p.theme || 'system', r = document.documentElement;
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        r.dataset.theme = t; r.classList.toggle('dark', t !== 'light'); } catch (e) {}
    </script>
  </head>
  <body>
    <noscript><p style="padding:16px;font-family:system-ui;color:#F5A524;background:#0B0D10">OpenFile runs in your browser and needs JavaScript for the tools. The page content below still works as a guide.</p></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
