name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      # Every tool, category and blog post must ship its preview media, docs entry and blog media (see scripts/check-parity.mjs)
      - name: Parity check
        run: node scripts/check-parity.mjs --dist
      # Publishes dist/ to the gh-pages branch (Settings → Pages → Deploy from branch: gh-pages / root)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
