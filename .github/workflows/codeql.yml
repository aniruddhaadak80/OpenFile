name: CodeQL

# Static analysis for the TypeScript app and the workflows. Results appear under Security, Code scanning.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'public/media/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'public/media/**']
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - dist
              - node_modules
              - public/ffmpeg
              - public/media
              - '**/*.min.js'
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
