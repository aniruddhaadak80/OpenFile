# Weekly, grouped dependency updates so the repo gets a few tidy pull requests instead of many.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to the exact peer version @imgly/background-removal requires. Bump both together.
      - dependency-name: onnxruntime-web
      # 2.x is AGPL-3.0; OpenFile is MIT. Stay on 1.x.
      - dependency-name: ua-parser-js
        versions: ['>=2.0.0']
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-base-images:
        patterns: ['*']
    commit-message:
      prefix: docker
